name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.88"
  UV_VERSION: "0.11.23"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check quality
        run: |
          cargo fmt --check
          cargo clippy --all-features --workspace --all-targets
          install_root="$RUNNER_TEMP/gel-cli-install"
          cargo install --locked --path . --root "$install_root"
          "$install_root/bin/gel" --version
          scripts/ci/check-action-pins.sh
          "$(go env GOPATH)/bin/actionlint"

  release-tooling:
    name: release tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Install release tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen
      - name: Check release tooling
        run: |
          set -euo pipefail
          uv run --frozen ruff check
          uv run --frozen ruff format --check
          uv run --frozen pytest scripts/release/tests -q

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            command: scripts/ci/test-unix.sh
          - name: macos-arm64
            runner: macos-15
            command: scripts/ci/test-unix.sh
          - name: windows-x64
            runner: windows-2025
            command: scripts/ci/test-windows.ps1
          - name: windows-arm64
            runner: windows-11-arm
            command: scripts/ci/test-windows.ps1
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Test
        run: ${{ matrix.command }}

# Rehearsal workflow registry activation
