name: Release candidate check

'on':
  pull_request:
    branches: [release/v*.x]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Generated release pull request to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-check-${{ github.event.pull_request.base.ref || inputs.pr_number }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.23"

jobs:
  candidate:
    name: stable merge gate
    if: github.repository == (vars.RELEASE_REPOSITORY || 'gelstable/gel-cli')
    runs-on: ubuntu-24.04
    permissions:
      # GitHub only exposes unpublished drafts to identities with push access.
      # The gate does not mutate contents, but it must read the draft and its
      # assets independently before allowing a merge.
      contents: write
      pull-requests: read
      attestations: read
    steps:
      - name: Fetch the live PR and current labels
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          # Every boundary below resolves through the live PR instead of the
          # event payload so a workflow_dispatch retry verifies exactly the
          # head branch protection will evaluate.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/live-pr.json"
          test -s "$RUNNER_TEMP/live-pr.json"
          {
            echo "number=$PR_NUMBER"
            echo "base_ref=$(jq -r '.base.ref' "$RUNNER_TEMP/live-pr.json")"
            echo "base_sha=$(jq -r '.base.sha' "$RUNNER_TEMP/live-pr.json")"
            echo "head_ref=$(jq -r '.head.ref' "$RUNNER_TEMP/live-pr.json")"
            echo "head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/live-pr.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Pin a dispatched run to the commit branch protection evaluates
        if: github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ steps.live.outputs.head_sha }}
          HEAD_REF: ${{ steps.live.outputs.head_ref }}
        run: |
          set -euo pipefail
          fail() {
            printf '%s\n' "$*" >&2
            printf -- '- stable merge gate failed: %s\n' "$*" \
              >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          }
          # A workflow_dispatch check run attaches to the head SHA of the ref it
          # was dispatched on, while every boundary below resolves through the
          # live PR. Callers therefore dispatch this workflow on the generated
          # head branch. If that branch moved between the dispatch and this run,
          # GITHUB_SHA is the older commit and the live PR head is the newer one;
          # passing here would record a result on a commit that was never
          # verified. Fail instead: the push that moved the branch fires
          # pull_request/synchronize under the release App installation token,
          # and the controller re-dispatches the gate on the new head,
          # so the fresh commit gets its own run.
          if [[ "$GITHUB_SHA" != "$HEAD_SHA" ]]; then
            fail "dispatched ref resolved to $GITHUB_SHA but the live head of $HEAD_REF is $HEAD_SHA; dispatch the gate again on the current head"
          fi

      - name: Check out the generated PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.live.outputs.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install release tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen

      - name: Allow ordinary backports without a candidate record
        id: classify
        env:
          BASE_REF: ${{ steps.live.outputs.base_ref }}
          BASE_SHA: ${{ steps.live.outputs.base_sha }}
          HEAD_REF: ${{ steps.live.outputs.head_ref }}
          HEAD_SHA: ${{ steps.live.outputs.head_sha }}
        run: |
          set -euo pipefail
          generated_head="$(uv run --frozen gel-release release-head --line "$BASE_REF")"
          if [[ "$HEAD_REF" == "$generated_head" ]]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin \
            "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          changed_records="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            packaging/release-candidate.json)"
          if [[ -n "$changed_records" ]]; then
            echo "ordinary backport changes a candidate record: $changed_records" >&2
            exit 1
          fi
          echo "generated=false" >> "$GITHUB_OUTPUT"
          echo "ordinary backport PR has no candidate record changes; stable gate is not applicable"

      - name: Fetch the prospective merge tree
        if: steps.classify.outputs.generated == 'true'
        id: merge
        env:
          PR_NUMBER: ${{ steps.live.outputs.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/pull/$PR_NUMBER/merge:refs/remotes/origin/pr/$PR_NUMBER/merge"
          merge_sha="$(git rev-parse "refs/remotes/origin/pr/$PR_NUMBER/merge^{commit}")"
          test "$merge_sha" = "$(git rev-parse "refs/remotes/origin/pr/$PR_NUMBER/merge")"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Read the stable candidate record from the PR head
        if: steps.classify.outputs.generated == 'true'
        env:
          HEAD_SHA: ${{ steps.live.outputs.head_sha }}
        run: |
          set -euo pipefail
          git show "$HEAD_SHA:packaging/release-candidate.json" > "$RUNNER_TEMP/record.json"
          test -s "$RUNNER_TEMP/record.json"

      - name: verify-draft and stable merge gate
        if: steps.classify.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          LIVE_PR_PATH: ${{ runner.temp }}/live-pr.json
          RECORD_PATH: ${{ runner.temp }}/record.json
          HEAD_SHA: ${{ steps.live.outputs.head_sha }}
        run: |
          set -euo pipefail
          # check_stable_merge verifies Cargo.toml, Cargo.lock, the complete
          # merge tree, and the draft assets through the GitHub API. The
          # snapshot is pure git — no toolchain — and binds the live head
          # GitHub reports right now to the tested source snapshot.
          snapshot="$(uv run --frozen gel-release snapshot --rev "$HEAD_SHA" --repo .)"
          uv run --frozen python - "$RECORD_PATH" "$LIVE_PR_PATH" "$MERGE_SHA" "$snapshot" <<'PY'
          import json
          import sys
          from pathlib import Path

          from gel_release import candidate, github_release

          record = candidate.load(Path(sys.argv[1]))
          live_pr = json.loads(Path(sys.argv[2]).read_text())
          github_release.check_stable_merge(
              record,
              live_pr,
              sys.argv[3],
              Path.cwd(),
              live_snapshot=sys.argv[4],
          )
          print("stable merge gate passed")
          PY
