name: Release PR

on:
  push:
    branches:
      - "release/v*.x"
  repository_dispatch:
    types: [release-line]

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.event.client_payload.base_ref || github.event.client_payload.line || github.ref_name }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.88"
  KNOPE_VERSION: "0.23.0"
  CONTROLLER_REF: master

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    if: github.repository == (vars.RELEASE_REPOSITORY || 'gelstable/gel-cli')
    env:
      BASE_REF: ${{ github.event.client_payload.base_ref || github.event.client_payload.line || github.ref_name }}
    steps:
      - name: Mint release App token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GEL_RELEASER_APP_ID }}
          private-key: ${{ secrets.GEL_RELEASER_KEY }}
          permission-actions: write
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.base_ref || github.event.client_payload.line || github.ref_name }}
          token: ${{ steps.release-token.outputs.token }}

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install release tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.23"
          uv sync --frozen

      - name: Validate release line and pending changes
        id: changes
        run: |
          set -euo pipefail
          uv run --frozen gel-release prepare-line \
            --base-ref "$BASE_REF" \
            --repo-root . > "$RUNNER_TEMP/prepare-line.json"
          pending="$(jq -r '.pending' "$RUNNER_TEMP/prepare-line.json")"
          case "$pending" in
            true|false) ;;
            *)
              echo "prepare-line returned an invalid pending value: $pending" >&2
              exit 1
              ;;
          esac
          {
            echo "pending=$pending"
            jq -r '"base_sha=" + .base_sha, "major=" + (.major | tostring)' \
              "$RUNNER_TEMP/prepare-line.json"
          } >> "$GITHUB_OUTPUT"
          if [[ "$pending" != true ]]; then
            echo "No pending change files on $BASE_REF; nothing to release."
          fi

      - name: Install Rust toolchain
        if: steps.changes.outputs.pending == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Knope
        if: steps.changes.outputs.pending == 'true'
        run: cargo install --locked --version "$KNOPE_VERSION" knope

      - name: Prepare the line-specific release branch
        if: steps.changes.outputs.pending == 'true'
        id: prepared
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          set -euo pipefail
          major="${{ steps.changes.outputs.major }}"
          head_ref="knope/release-v${major}.x"
          base_sha="${{ steps.changes.outputs.base_sha }}"

          # Read the current generated head before replacing it; the push step
          # needs it for --force-with-lease. Resetting the branch from the
          # line tip is itself the invalidation of any candidate record the
          # old generated head carried, and the removal below drops the record
          # a merged line tip carries, so preparation can never keep a stale
          # record in the tree it prepares.
          git fetch --no-tags origin \
            "refs/heads/${head_ref}:refs/remotes/origin/${head_ref}" \
            2>/dev/null || true
          old_head_sha=""
          if git show-ref --verify --quiet "refs/remotes/origin/${head_ref}"; then
            old_head_sha="$(git rev-parse "refs/remotes/origin/${head_ref}^{commit}")"
          fi

          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git switch -C "$head_ref" "$base_sha"
          if [[ -e packaging/release-candidate.json ]]; then
            git rm -f packaging/release-candidate.json
          fi
          git config user.name "gelstable-release"
          git config user.email "release@gelstable.invalid"
          knope prepare-release

          # Knope can take long enough for another line push to land. Refresh
          # the tracking ref now, immediately before validating the prepared
          # tree, so a stale base cannot be force-with-lease refreshed.
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          uv run --frozen gel-release prepare-line \
            --base-ref "$BASE_REF" \
            --repo-root . \
            --prepared \
            --head-ref "$head_ref" \
            --expected-base-sha "$base_sha" > "$RUNNER_TEMP/prepared-line.json"
          version="$(jq -r '.prepared_version' "$RUNNER_TEMP/prepared-line.json")"
          if [[ "$version" == null || -z "$version" ]]; then
            echo "Knope did not produce a prepared version" >&2
            exit 1
          fi
          {
            echo "head_ref=$head_ref"
            echo "version=$version"
            echo "old_head_sha=$old_head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Push the prepared release branch
        if: steps.changes.outputs.pending == 'true'
        env:
          BASE_REF: ${{ env.BASE_REF }}
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
          HEAD_REF: ${{ steps.prepared.outputs.head_ref }}
          OLD_HEAD_SHA: ${{ steps.prepared.outputs.old_head_sha }}
        run: |
          set -euo pipefail
          # Check the live line again in the step that can update the remote
          # head. This closes the gap between post-Knope validation and push.
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          live_base_sha="$(git rev-parse "refs/remotes/origin/${BASE_REF}^{commit}")"
          if [[ "$live_base_sha" != "$BASE_SHA" ]]; then
            echo "release line ${BASE_REF} moved during preparation: expected ${BASE_SHA}, got ${live_base_sha}" >&2
            exit 1
          fi
          if [[ -n "$OLD_HEAD_SHA" ]]; then
            git push --force-with-lease="refs/heads/${HEAD_REF}:${OLD_HEAD_SHA}" \
              origin "HEAD:refs/heads/${HEAD_REF}"
          else
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          fi

      - name: Create or refresh the release pull request
        if: steps.changes.outputs.pending == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ steps.prepared.outputs.version }}
          HEAD_REF: ${{ steps.prepared.outputs.head_ref }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/release-pr-body.md"
          cat > "$body_file" <<EOF
          Automated release pull request for ${VERSION} on ${BASE_REF}.

          The candidate controller stages and verifies the immutable release after this PR is refreshed. Merging this PR authorizes publication of the reviewed stable candidate.
          EOF
          pr_number="$(uv run --frozen gel-release pr-sync \
            --repo "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --version "$VERSION" \
            --body-file "$body_file")"
          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "could not resolve the prepared release PR number" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
            > "$RUNNER_TEMP/release-pr.json"
          uv run --frozen gel-release pr-identity \
            --pr-json "$RUNNER_TEMP/release-pr.json" \
            --repo "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/release-pr-identity.json"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Dispatch the release controller
        if: steps.changes.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Dispatch explicitly after creation or refresh: the first generated
          # branch push precedes its PR, so there is no synchronize event yet.
          gh workflow run release-controller.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$CONTROLLER_REF" \
            -f line="$BASE_REF" \
            -f pr="$PR_NUMBER"

# Rehearsal workflow registry activation
